name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: app/go.mod
      - run: go mod download
      - run: go vet ./...

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: app/go.mod
      - run: go mod download
      - run: go test ./...

  build:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image name
        shell: bash
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image
        run: docker save "$IMAGE:$GITHUB_SHA" -o "${RUNNER_TEMP}/image.tar"
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 7
          if-no-files-found: error
      - name: Report high and critical vulnerabilities
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 127.0.0.1:8080:8000 "$IMAGE:$GITHUB_SHA"
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused "http://127.0.0.1:8080/healthz"
      - name: Container logs on failure
        if: failure()
        run: docker logs app || true
      - name: Clean up container
        if: always()
        run: docker rm -f app || true
